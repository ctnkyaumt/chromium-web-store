name: Publish extra CRX

# Republishes the self-hosted extensions in extra/ whenever one of the source
# crx files is replaced. Only extra/*.crx triggers this; the generated files
# land in extra/dist/ so the commit made here cannot retrigger the workflow.
#
# Each extension needs its own signing key: the extension id derives from the
# key, so two crx files signed with the same one would collide. extra/extensions.json
# maps each source crx to the secret holding its key.
on:
  push:
    branches: [master]
    paths:
      - "extra/*.crx"
      - "extra/extensions.json"
      - ".github/scripts/crx_tools.py"
      - ".github/workflows/extra.yml"
  workflow_dispatch:

env:
  GH_REPO: ${{ github.repository }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install cryptography

      - name: Repack and publish
        env:
          # Every key a crx in extra/ can be signed with. The loop below picks
          # the one extra/extensions.json names for that crx.
          EXTRA_CRX_KEY: ${{ secrets.EXTRA_CRX_KEY }}
          EXTRA_CRX_KEY_MATCH_ALARM: ${{ secrets.EXTRA_CRX_KEY_MATCH_ALARM }}
        run: |
          set -euo pipefail
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/master/extra/dist"
          trap 'rm -f extra_key.pem' EXIT

          for src in extra/*.crx; do
            name="$(basename "$src" .crx)"
            echo "::group::$name"

            secret_name="$(python -c 'import json,sys; e=json.load(open("extra/extensions.json")).get(sys.argv[1]); print(e["key_secret"] if e else "")' "$name")"
            if [ -z "$secret_name" ]; then
              echo "::error::$src has no entry in extra/extensions.json. Add one naming the secret that holds its signing key."
              exit 1
            fi
            key_pem="$(printf '%s' "${!secret_name-}")"
            if [ -z "$key_pem" ]; then
              echo "::error::Secret $secret_name is not set (needed by $src). Generate one with: openssl genrsa 2048"
              echo "::error::New secrets must also be listed in the env: block of this workflow."
              exit 1
            fi
            printf '%s\n' "$key_pem" > extra_key.pem

            CRX_ID="$(python .github/scripts/crx_tools.py id --key extra_key.pem | cut -d= -f2)"
            python .github/scripts/crx_tools.py repack \
              --input "$src" \
              --output "extra/dist/$name.crx" \
              --key extra_key.pem \
              --update-url "$RAW/$name.updates.xml" \
              --state "extra/dist/$name.state.json"
            VERSION="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "extra/dist/$name.state.json")"
            python .github/scripts/crx_tools.py updates-xml \
              --appid "$CRX_ID" \
              --version "$VERSION" \
              --codebase "$RAW/$name.crx" \
              --output "extra/dist/$name.updates.xml"
            rm -f extra_key.pem

            echo "- **$name** -> id \`$CRX_ID\`, version \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extra/dist
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "extra: republish self-hosted crx"
          git push origin HEAD:master
